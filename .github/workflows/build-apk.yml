name: Build Android AAB & APK (Google Play Ready)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle (AAB) & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystores and Environment
        run: |
          # 1. Prepare Debug Keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare Release Upload Keystore (For Play Store .aab signing)
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DRUGs Nepal,OU=Eternity,O=Medical,L=Kathmandu,C=NP"
          fi

          # 3. Environment configuration
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.drugsnepal.kcdx"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          fi

      - name: Build Android App Bundle (.aab) & APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:bundleRelease :app:assembleDebug --no-daemon || ./gradlew :app:bundleDebug :app:assembleDebug --no-daemon
          else
            gradle :app:bundleRelease :app:assembleDebug --no-daemon || gradle :app:bundleDebug :app:assembleDebug --no-daemon
          fi

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRUGs-Nepal-PlayStore-AAB
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 30

      - name: Upload Direct Installable APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRUGs-Nepal-Installable-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
